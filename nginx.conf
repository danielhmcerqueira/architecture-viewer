server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cache agressivo para assets versionados do Vite.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — qualquer rota do TanStack Router resolve para index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
